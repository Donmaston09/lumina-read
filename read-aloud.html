<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Read Aloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --surface2: #f0ede6;
    --border: rgba(0,0,0,0.09);
    --border-md: rgba(0,0,0,0.15);
    --text: #1a1814;
    --text2: #6b6760;
    --text3: #a09d97;
    --accent: #1a5fa8;
    --accent-hover: #0d4a8a;
    --accent-light: #e8f0fb;
    --accent-text: #1a5fa8;
    --danger: #c0392b;
    --success: #2d7d46;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 24px rgba(0,0,0,0.10);
    --radius: 10px;
    --radius-lg: 16px;
    --radius-xl: 22px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111010;
      --surface: #1c1b19;
      --surface2: #252320;
      --border: rgba(255,255,255,0.08);
      --border-md: rgba(255,255,255,0.14);
      --text: #f0ede6;
      --text2: #9a9690;
      --text3: #6a6760;
      --accent: #4a8fd4;
      --accent-hover: #6aaae0;
      --accent-light: #1a2a3a;
      --accent-text: #7db8e8;
      --shadow: 0 2px 12px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 24px rgba(0,0,0,0.4);
    }
  }

  html, body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 4rem;
  }

  .container {
    width: 100%;
    max-width: 640px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 2.5rem;
    animation: fadeUp 0.5s ease both;
  }

  .logo {
    width: 44px; height: 44px;
    background: var(--accent);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .logo svg { width: 22px; height: 22px; }

  .header-text h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    font-weight: 400;
    color: var(--text);
    line-height: 1.2;
  }

  .header-text p {
    font-size: 13px;
    color: var(--text2);
  }

  /* Status */
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 1.5rem;
    box-shadow: var(--shadow);
    animation: fadeUp 0.5s 0.1s ease both;
  }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--success);
    flex-shrink: 0;
  }

  .status-dot.loading { background: #e67e22; animation: blink 1s ease infinite; }
  .status-dot.reading { background: var(--accent); animation: blink 0.8s ease infinite; }
  .status-dot.error { background: var(--danger); }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* URL input */
  .url-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 1.25rem;
    box-shadow: var(--shadow);
    animation: fadeUp 0.5s 0.15s ease both;
  }

  .url-label {
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text3);
    margin-bottom: 10px;
  }

  .url-row {
    display: flex;
    gap: 8px;
  }

  .url-input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border-md);
    border-radius: var(--radius);
    background: var(--surface2);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .url-input::placeholder { color: var(--text3); }

  .url-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(26,95,168,0.12);
  }

  .btn-primary {
    padding: 10px 18px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, transform 0.1s;
  }

  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:active { transform: scale(0.97); }

  .btn-primary:disabled {
    background: var(--text3);
    cursor: not-allowed;
    transform: none;
  }

  /* Player */
  .player {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 18px 16px;
    margin-bottom: 1.25rem;
    box-shadow: var(--shadow);
    display: none;
    animation: slideDown 0.3s ease;
  }

  .player.visible { display: block; }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .player-top {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    margin-bottom: 14px;
  }

  .player-thumb {
    width: 40px; height: 40px;
    background: var(--accent-light);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    color: var(--accent-text);
    font-size: 11px;
    font-weight: 500;
  }

  .player-meta { flex: 1; min-width: 0; }

  .player-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-bottom: 2px;
  }

  .player-host {
    font-size: 12px;
    color: var(--text3);
  }

  .speed-chip {
    padding: 4px 10px;
    border: 1px solid var(--border-md);
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text2);
    background: var(--surface2);
    cursor: pointer;
    flex-shrink: 0;
    align-self: flex-start;
    transition: background 0.15s;
  }

  .speed-chip:hover { background: var(--border); }

  .progress-track {
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    margin-bottom: 14px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0%;
    transition: width 0.4s linear;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .ctrl {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border-md);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.1s;
    flex-shrink: 0;
  }

  .ctrl:hover { background: var(--surface2); }
  .ctrl:active { transform: scale(0.93); }

  .ctrl svg { width: 15px; height: 15px; }

  .ctrl.big {
    width: 42px; height: 42px;
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .ctrl.big:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

  .ctrl.big svg { width: 18px; height: 18px; }

  .ctrl.danger { border-color: transparent; }
  .ctrl.danger:hover { background: #fde8e6; color: var(--danger); }

  .elapsed {
    font-size: 12px;
    color: var(--text3);
    font-variant-numeric: tabular-nums;
    margin-left: auto;
  }

  /* Transcript */
  .transcript {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--text2);
    line-height: 1.9;
    max-height: 140px;
    overflow-y: auto;
    display: none;
  }

  .transcript.visible { display: block; }

  .transcript::-webkit-scrollbar { width: 4px; }
  .transcript::-webkit-scrollbar-track { background: transparent; }
  .transcript::-webkit-scrollbar-thumb { background: var(--border-md); border-radius: 2px; }

  .w { display: inline; }
  .w.active { background: rgba(26,95,168,0.15); border-radius: 2px; }

  /* Saved links */
  .saved-section {
    animation: fadeUp 0.5s 0.2s ease both;
  }

  .section-label {
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text3);
    margin-bottom: 10px;
  }

  .link-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
    box-shadow: var(--shadow);
  }

  .link-item:hover {
    border-color: var(--border-md);
    box-shadow: var(--shadow-md);
  }

  .link-fav {
    width: 32px; height: 32px;
    border-radius: 7px;
    background: var(--surface2);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 14px;
    overflow: hidden;
  }

  .link-fav img { width: 20px; height: 20px; object-fit: contain; }

  .link-info { flex: 1; min-width: 0; }

  .link-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .link-domain {
    font-size: 12px;
    color: var(--text3);
  }

  .link-badge {
    font-size: 11px;
    color: var(--text3);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .add-link-row {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }

  .add-input {
    flex: 1;
    padding: 9px 12px;
    border: 1px solid var(--border-md);
    border-radius: var(--radius);
    background: var(--surface2);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    outline: none;
  }

  .add-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(26,95,168,0.1);
  }

  .add-input::placeholder { color: var(--text3); }

  .btn-ghost {
    padding: 9px 14px;
    border: 1px solid var(--border-md);
    border-radius: var(--radius);
    background: transparent;
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }

  .btn-ghost:hover { background: var(--surface2); }

  /* Settings */
  .settings-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-top: 1.25rem;
    box-shadow: var(--shadow);
    animation: fadeUp 0.5s 0.25s ease both;
  }

  .settings-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
  }

  @media (max-width: 480px) {
    .settings-grid { grid-template-columns: 1fr; }
    .header h1 { font-size: 19px; }
  }

  .settings-field label {
    display: block;
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text3);
    margin-bottom: 6px;
  }

  .settings-field select, .settings-field input[type=range] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border-md);
    border-radius: var(--radius);
    background: var(--surface2);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    outline: none;
    cursor: pointer;
    appearance: auto;
  }

  /* Modal */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    backdrop-filter: blur(3px);
  }

  .overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border-radius: var(--radius-xl);
    border: 1px solid var(--border);
    padding: 28px 26px 24px;
    max-width: 380px;
    width: 100%;
    box-shadow: var(--shadow-md);
    animation: popIn 0.25s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.88); }
    to { opacity: 1; transform: scale(1); }
  }

  .modal-icon {
    width: 52px; height: 52px;
    background: var(--accent-light);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 18px;
  }

  .modal-icon svg { width: 26px; height: 26px; color: var(--accent-text); }

  .modal h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 8px;
  }

  .modal p {
    font-size: 14px;
    color: var(--text2);
    line-height: 1.6;
    margin-bottom: 22px;
  }

  .modal-url {
    font-size: 12px;
    color: var(--text3);
    background: var(--surface2);
    border-radius: 6px;
    padding: 6px 10px;
    margin-bottom: 22px;
    word-break: break-all;
    line-height: 1.5;
    border: 1px solid var(--border);
  }

  .modal-btns {
    display: flex;
    gap: 10px;
  }

  .modal-btns .btn-primary { flex: 1; text-align: center; }
  .modal-btns .btn-ghost { flex: 1; text-align: center; border-radius: var(--radius); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--text);
    color: var(--bg);
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 999px;
    z-index: 300;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
    opacity: 0;
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-md); border-radius: 3px; }

  .no-links-msg {
    font-size: 13px;
    color: var(--text3);
    text-align: center;
    padding: 1rem 0 0.5rem;
  }
</style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>Read Aloud</h1>
      <p>Open any link — we'll offer to read it to you</p>
    </div>
  </div>

  <!-- Status -->
  <div class="status-pill">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Ready — paste a URL or open a saved link</span>
  </div>

  <!-- URL input -->
  <div class="url-section">
    <div class="url-label">Open a link</div>
    <div class="url-row">
      <input class="url-input" id="urlInput" type="url" placeholder="https://any-article-or-page.com/..." autocomplete="off" />
      <button class="btn-primary" id="openBtn">Open</button>
    </div>
  </div>

  <!-- Player -->
  <div class="player" id="player">
    <div class="player-top">
      <div class="player-thumb" id="playerThumb">...</div>
      <div class="player-meta">
        <div class="player-title" id="playerTitle">Article</div>
        <div class="player-host" id="playerHost">loading...</div>
      </div>
      <button class="speed-chip" id="speedChip">1×</button>
    </div>
    <div class="progress-track" id="progressTrack">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="controls">
      <button class="ctrl" id="rewindBtn" title="Restart from beginning">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/>
        </svg>
      </button>
      <button class="ctrl big" id="playPauseBtn">
        <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
      </button>
      <button class="ctrl danger" id="stopBtn" title="Stop reading">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
      </button>
      <button class="ctrl" id="transcriptToggle" title="Show/hide text">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="15" y2="18"/>
        </svg>
      </button>
      <span class="elapsed" id="elapsed">0:00</span>
    </div>
    <div class="transcript" id="transcript"></div>
  </div>

  <!-- Saved links -->
  <div class="saved-section">
    <div class="section-label">Saved links</div>
    <div id="linksList"></div>
    <div class="add-link-row" style="margin-top:8px;">
      <input class="add-input" id="addInput" type="url" placeholder="Paste a URL to save for later..." />
      <button class="btn-ghost" id="addBtn">Save</button>
    </div>
  </div>

  <!-- Settings -->
  <div class="settings-card">
    <div class="section-label">Reading settings</div>
    <div class="settings-grid">
      <div class="settings-field">
        <label>Voice</label>
        <select id="voiceSelect"><option value="">Loading voices...</option></select>
      </div>
      <div class="settings-field">
        <label>Speed</label>
        <select id="rateSelect">
          <option value="0.75">Slow (0.75×)</option>
          <option value="1" selected>Normal (1×)</option>
          <option value="1.25">Slightly fast (1.25×)</option>
          <option value="1.5">Fast (1.5×)</option>
          <option value="2">Very fast (2×)</option>
        </select>
      </div>
    </div>
  </div>

</div><!-- /container -->

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
    </div>
    <h2>Read this aloud?</h2>
    <p id="modalMsg">Would you like me to read this page out loud for you?</p>
    <div class="modal-url" id="modalURL"></div>
    <div class="modal-btns">
      <button class="btn-primary" id="yesBtn">Yes, read it</button>
      <button class="btn-ghost" id="noBtn">No thanks</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ─── Storage ────────────────────────────────────────────────
const STORAGE_KEY = 'readaloud_links_v1';
let savedLinks = [];

function loadLinks() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    savedLinks = raw ? JSON.parse(raw) : [];
  } catch(e) { savedLinks = []; }
}

function saveLinks() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(savedLinks)); } catch(e) {}
}

// ─── State ──────────────────────────────────────────────────
let pendingURL = '';
let pendingTitle = '';
let currentText = '';
let utterance = null;
let isPaused = false;
let wordIndex = 0;
let wordSpans = [];
let elapsedSecs = 0;
let timerRef = null;
let startStamp = null;
const speeds = [0.75, 1, 1.25, 1.5, 2];
let speedIdx = 1;

// ─── DOM refs ───────────────────────────────────────────────
const statusDot   = document.getElementById('statusDot');
const statusText  = document.getElementById('statusText');
const urlInput    = document.getElementById('urlInput');
const openBtn     = document.getElementById('openBtn');
const player      = document.getElementById('player');
const playerThumb = document.getElementById('playerThumb');
const playerTitle = document.getElementById('playerTitle');
const playerHost  = document.getElementById('playerHost');
const speedChip   = document.getElementById('speedChip');
const progressFill= document.getElementById('progressFill');
const playPauseBtn= document.getElementById('playPauseBtn');
const iconPlay    = document.getElementById('iconPlay');
const iconPause   = document.getElementById('iconPause');
const stopBtn     = document.getElementById('stopBtn');
const rewindBtn   = document.getElementById('rewindBtn');
const transcriptEl= document.getElementById('transcript');
const transcriptToggle = document.getElementById('transcriptToggle');
const elapsed     = document.getElementById('elapsed');
const overlay     = document.getElementById('overlay');
const modalMsg    = document.getElementById('modalMsg');
const modalURL    = document.getElementById('modalURL');
const yesBtn      = document.getElementById('yesBtn');
const noBtn       = document.getElementById('noBtn');
const voiceSelect = document.getElementById('voiceSelect');
const rateSelect  = document.getElementById('rateSelect');
const linksList   = document.getElementById('linksList');
const addInput    = document.getElementById('addInput');
const addBtn      = document.getElementById('addBtn');
const toastEl     = document.getElementById('toast');

// ─── Status helper ──────────────────────────────────────────
function setStatus(msg, type='idle') {
  statusText.textContent = msg;
  statusDot.className = 'status-dot' + (type !== 'idle' ? ' ' + type : '');
}

// ─── Toast ──────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  clearTimeout(toastTimer);
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2800);
}

// ─── Extract hostname ────────────────────────────────────────
function getHost(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch(e) { return url; }
}

function getInitials(host) {
  return host.replace(/\.[^.]+$/, '').slice(0, 2).toUpperCase();
}

// ─── Open link → show modal ──────────────────────────────────
function triggerLink(url, title) {
  if (!url) return;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  pendingURL = url;
  pendingTitle = title || getHost(url);
  const short = pendingURL.length > 60 ? pendingURL.slice(0, 58) + '…' : pendingURL;
  modalMsg.textContent = `Would you like me to read "${pendingTitle.slice(0,55)}" aloud while you do something else?`;
  modalURL.textContent = short;
  overlay.classList.add('open');
  setStatus('Link opened — choose an option', 'loading');
}

openBtn.addEventListener('click', () => {
  const val = urlInput.value.trim();
  if (!val) { showToast('Please enter a URL first'); return; }
  triggerLink(val, '');
});

urlInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') openBtn.click();
});

// ─── Modal buttons ───────────────────────────────────────────
yesBtn.addEventListener('click', () => {
  overlay.classList.remove('open');
  fetchAndRead(pendingURL, pendingTitle);
});

noBtn.addEventListener('click', () => {
  overlay.classList.remove('open');
  setStatus('Ready — paste a URL or open a saved link');
});

// ─── Fetch text from URL ─────────────────────────────────────
async function fetchAndRead(url, title) {
  setStatus('Fetching page content…', 'loading');
  openBtn.disabled = true;

  try {
    // Use a CORS proxy to fetch the page
    const proxyURL = 'https://api.allorigins.win/get?url=' + encodeURIComponent(url);
    const resp = await fetch(proxyURL);
    if (!resp.ok) throw new Error('Network error');
    const data = await resp.json();
    const html = data.contents;

    const doc = new DOMParser().parseFromString(html, 'text/html');

    // Remove noise
    ['script','style','nav','header','footer','aside','form',
     '.nav','.footer','.sidebar','.menu','.ad','.advertisement',
     '[role=navigation]','[role=banner]','[role=complementary]'
    ].forEach(sel => {
      try { doc.querySelectorAll(sel).forEach(el => el.remove()); } catch(e){}
    });

    // Try to get the page title
    const pageTitle = doc.querySelector('title')?.textContent?.trim()
      || doc.querySelector('h1')?.textContent?.trim()
      || title || getHost(url);

    // Extract main content — try common article selectors
    const selectors = ['article','[role=main]','main','.post-content',
      '.article-body','.entry-content','.story-body','.content','.post','#content','#main'];
    let mainEl = null;
    for (const s of selectors) {
      mainEl = doc.querySelector(s);
      if (mainEl && mainEl.innerText?.trim().length > 200) break;
    }
    if (!mainEl) mainEl = doc.body;

    // Get text, collapse whitespace
    let text = (mainEl.innerText || mainEl.textContent || '')
      .replace(/\s{2,}/g, ' ')
      .replace(/\n{2,}/g, '. ')
      .trim();

    if (text.length < 80) throw new Error('Not enough readable text found on this page');

    // Limit to ~6000 words to avoid very long reads
    const wordsArr = text.split(/\s+/);
    if (wordsArr.length > 6000) {
      text = wordsArr.slice(0, 6000).join(' ') + '… (article truncated for reading)';
    }

    beginReading(url, pageTitle, text);

  } catch(err) {
    console.error(err);
    setStatus('Could not fetch page — check the URL or your internet connection', 'error');
    showToast('Could not read page: ' + (err.message || 'Unknown error'));
    openBtn.disabled = false;
  }
}

// ─── Begin reading ───────────────────────────────────────────
function beginReading(url, title, text) {
  stopReading(false);

  currentText = text;
  const host = getHost(url);

  playerTitle.textContent = title;
  playerHost.textContent = host;
  playerThumb.textContent = getInitials(host);

  // Build transcript with word spans
  const words = text.split(/\s+/);
  transcriptEl.innerHTML = words.map((w, i) =>
    `<span class="w" id="w${i}">${w} </span>`
  ).join('');
  wordSpans = words;
  wordIndex = 0;

  player.classList.add('visible');
  setStatus('Reading aloud — use the controls to pause or stop', 'reading');
  openBtn.disabled = false;
  urlInput.value = '';

  speak(text, 0);
}

function speak(text, startWord) {
  if (!('speechSynthesis' in window)) {
    showToast('Text-to-speech is not supported in this browser');
    return;
  }

  utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = parseFloat(rateSelect.value);
  utterance.pitch = 1;

  const voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
  const selIdx = parseInt(voiceSelect.value);
  if (!isNaN(selIdx) && voices[selIdx]) utterance.voice = voices[selIdx];

  utterance.onboundary = e => {
    if (e.name !== 'word') return;
    const prev = document.getElementById('w' + (wordIndex - 1));
    if (prev) prev.classList.remove('active');
    const cur = document.getElementById('w' + wordIndex);
    if (cur) {
      cur.classList.add('active');
      cur.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
    wordIndex++;
    const pct = Math.min(100, Math.round((wordIndex / wordSpans.length) * 100));
    progressFill.style.width = pct + '%';
  };

  utterance.onstart = () => {
    isPaused = false;
    iconPlay.style.display = 'none';
    iconPause.style.display = '';
    elapsedSecs = 0;
    startStamp = Date.now();
    clearInterval(timerRef);
    timerRef = setInterval(tickTimer, 1000);
  };

  utterance.onend = () => {
    clearInterval(timerRef);
    isPaused = false;
    iconPlay.style.display = '';
    iconPause.style.display = 'none';
    progressFill.style.width = '100%';
    setStatus('Done reading — paste another link to continue');
    statusDot.className = 'status-dot';
  };

  utterance.onerror = e => {
    if (e.error === 'interrupted' || e.error === 'canceled') return;
    showToast('Speech error: ' + e.error);
    setStatus('Ready', 'idle');
  };

  speechSynthesis.speak(utterance);
}

function tickTimer() {
  if (!isPaused) elapsedSecs = Math.floor((Date.now() - startStamp) / 1000);
  const m = Math.floor(elapsedSecs / 60);
  const s = elapsedSecs % 60;
  elapsed.textContent = m + ':' + (s < 10 ? '0' : '') + s;
}

// ─── Controls ────────────────────────────────────────────────
playPauseBtn.addEventListener('click', () => {
  if (!utterance) return;
  if (speechSynthesis.paused || isPaused) {
    speechSynthesis.resume();
    isPaused = false;
    startStamp = Date.now() - elapsedSecs * 1000;
    iconPlay.style.display = 'none';
    iconPause.style.display = '';
    setStatus('Reading aloud — use the controls to pause or stop', 'reading');
  } else {
    speechSynthesis.pause();
    isPaused = true;
    iconPlay.style.display = '';
    iconPause.style.display = 'none';
    setStatus('Paused — press play to continue');
    statusDot.className = 'status-dot';
  }
});

function stopReading(resetPlayer = true) {
  speechSynthesis.cancel();
  clearInterval(timerRef);
  utterance = null;
  isPaused = false;
  iconPlay.style.display = '';
  iconPause.style.display = 'none';
  if (resetPlayer) {
    player.classList.remove('visible');
    progressFill.style.width = '0%';
    elapsed.textContent = '0:00';
    transcriptEl.classList.remove('visible');
    setStatus('Ready — paste a URL or open a saved link');
    statusDot.className = 'status-dot';
  }
}

stopBtn.addEventListener('click', () => stopReading(true));

rewindBtn.addEventListener('click', () => {
  if (currentText) {
    wordIndex = 0;
    elapsedSecs = 0;
    elapsed.textContent = '0:00';
    progressFill.style.width = '0%';
    speechSynthesis.cancel();
    // rebuild transcript highlighting
    transcriptEl.querySelectorAll('.w').forEach(s => s.classList.remove('active'));
    setTimeout(() => speak(currentText, 0), 150);
    setStatus('Restarted from beginning', 'reading');
  }
});

transcriptToggle.addEventListener('click', () => {
  transcriptEl.classList.toggle('visible');
});

// ─── Speed ───────────────────────────────────────────────────
speedChip.addEventListener('click', () => {
  speedIdx = (speedIdx + 1) % speeds.length;
  const s = speeds[speedIdx];
  speedChip.textContent = s + '×';
  rateSelect.value = s;
  // If currently speaking, restart with new speed
  if (utterance && currentText) {
    const idx = wordIndex;
    speechSynthesis.cancel();
    setTimeout(() => {
      const remainingWords = wordSpans.slice(Math.max(0, idx - 2));
      speak(remainingWords.join(' '), 0);
    }, 120);
  }
});

rateSelect.addEventListener('change', () => {
  const val = parseFloat(rateSelect.value);
  speedChip.textContent = val + '×';
  speedIdx = speeds.indexOf(val);
  if (speedIdx < 0) speedIdx = 1;
});

// ─── Voices ──────────────────────────────────────────────────
function loadVoices() {
  const voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
  if (!voices.length) return;
  voiceSelect.innerHTML = voices.map((v, i) =>
    `<option value="${i}"${v.default ? ' selected' : ''}>${v.name} (${v.lang})</option>`
  ).join('');
}

if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = loadVoices;
}
setTimeout(loadVoices, 400);

// ─── Saved links ─────────────────────────────────────────────
function renderSavedLinks() {
  if (!savedLinks.length) {
    linksList.innerHTML = '<div class="no-links-msg">No saved links yet — add one below</div>';
    return;
  }
  linksList.innerHTML = '';
  savedLinks.forEach((link, i) => {
    const host = getHost(link.url);
    const div = document.createElement('div');
    div.className = 'link-item';
    div.innerHTML = `
      <div class="link-fav">
        <img src="https://www.google.com/s2/favicons?domain=${host}&sz=32" alt="" onerror="this.style.display='none'" />
      </div>
      <div class="link-info">
        <div class="link-name">${link.title || host}</div>
        <div class="link-domain">${host}</div>
      </div>
      <span class="link-badge">Read</span>
    `;
    div.addEventListener('click', () => triggerLink(link.url, link.title || host));
    // Right-click or long press to remove
    div.addEventListener('contextmenu', e => {
      e.preventDefault();
      if (confirm('Remove "' + (link.title || host) + '" from saved links?')) {
        savedLinks.splice(i, 1);
        saveLinks();
        renderSavedLinks();
      }
    });
    linksList.appendChild(div);
  });
}

addBtn.addEventListener('click', () => {
  const val = addInput.value.trim();
  if (!val) return;
  let url = val;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  const host = getHost(url);
  savedLinks.unshift({ url, title: host });
  saveLinks();
  renderSavedLinks();
  addInput.value = '';
  showToast('Link saved!');
});

addInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') addBtn.click();
});

// ─── Init ────────────────────────────────────────────────────
loadLinks();
renderSavedLinks();

// Keep speech synthesis alive on iOS (workaround for background tab pausing)
setInterval(() => {
  if (speechSynthesis.speaking && !isPaused) {
    speechSynthesis.pause();
    speechSynthesis.resume();
  }
}, 14000);
</script>
